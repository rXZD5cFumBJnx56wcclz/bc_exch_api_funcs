[package]
name = "bc_exch_api_funcs"
version = "0.3.0"
edition = "2024"

[dependencies]
bc_utils_lg = {path = "../bc_utils_lg"}

tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11.27", features = ["json"] }
serde ={ version = "1.0", features = ["derive"]}
serde_json5 = "0.1"
serde_with = "3"
futures = "0.3"
chrono = "0.4"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
tokio-tungstenite = "0.27"
futures-util = "0.3"
tokio-rustls = "0.26"
rustls-native-certs = "0.8"

[dev-dependencies]
criterion = {version = "0.3.5", features = ["html_reports", "async_tokio"]}
pretty_assertions = "1"

[[bench]]
name = "kline_bybit"
path = "benches/bybit/market/kline.rs"
harness = false

[[bench]]
name = "tickers_bybit"
path = "benches/bybit/market/tickers.rs"
harness = false

[[bench]]
name = "wallet_balance_bybit"
path = "benches/bybit/account/wallet_balance.rs"
harness = false
